[cursor.style]
blinking = "Always"
shape = "Block"

[font]
# AppleFontSmoothing = true
size = 16.0

[font.bold]
family = "SF Mono"
style = "Semibold"

[font.normal]
family = "SF Mono"

[terminal.shell]
args = ["--login"]
program = "/bin/zsh"

[window]
dynamic_title = true
title = "Terminal"

[window.padding]
x = 20
y = 20

